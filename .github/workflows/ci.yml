name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch cancels the first: the older run's result is
# about code nobody is going to merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — build and tests
    runs-on: ubuntu-latest

    # Real Postgres and Redis. The properties these suites check are properties
    # of Sequelize hooks, Postgres constraints and transaction boundaries, and a
    # mock proves none of them.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/inventory_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      - name: Install Postgres extensions
        # The suites build their schema with sync(), which never runs the
        # migration that installs these.
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d inventory_test \
            -c 'CREATE EXTENSION IF NOT EXISTS "pgcrypto"; CREATE EXTENSION IF NOT EXISTS "citext";'

      - name: Dependency audit
        # A gate, not a report. Production dependencies only: a dev-tool
        # advisory should not block a deploy, and --omit=dev says so explicitly
        # rather than by choosing a lenient severity threshold.
        run: npm audit --omit=dev --audit-level=moderate

      - run: npm run build

      - name: Migrations apply from an empty database
        # Catches a migration that only works against a schema that already has
        # last month's tables in it.
        run: npm run migrate

      - run: npm run test:isolation

  web:
    name: Web — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm run build
